<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}NovaMarket{% endblock %}</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:#f4f6fa;color:#1d2433}
a{color:inherit;text-decoration:none}
.top{background:#0f2747;color:#fff;padding:12px 0}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.top .wrap{display:flex;align-items:center;gap:20px}
.logo{font-size:24px;font-weight:800;letter-spacing:.5px;white-space:nowrap}
.logo span{color:#ffb020}
.search{flex:1;display:flex}
.search input{flex:1;padding:10px 14px;border:0;border-radius:6px 0 0 6px;font-size:15px}
.search button{padding:10px 18px;border:0;background:#ffb020;border-radius:0 6px 6px 0;font-weight:700;cursor:pointer}
.acts{white-space:nowrap}
.acts a{margin-left:16px;font-size:14px}
.cats{background:#fff;border-bottom:1px solid #e3e7ef}
.cats .wrap{display:flex;gap:22px;padding:12px 16px;font-size:14px;font-weight:600;overflow-x:auto}
.cats a:hover{color:#0f5fd7}
.hero{background:linear-gradient(120deg,#0f2747,#1f5fbf);color:#fff;border-radius:12px;padding:40px;margin:22px 0}
.hero h1{margin:0 0 10px;font-size:34px}
.hero p{margin:0 0 18px;opacity:.9}
.btn{display:inline-block;background:#ffb020;color:#1d2433;padding:10px 18px;border-radius:6px;font-weight:700;border:0;cursor:pointer;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;margin:20px 0}
.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;flex-direction:column}
.thumb{height:160px;display:flex;align-items:center;justify-content:center;font-size:64px}
.info{padding:14px;display:flex;flex-direction:column;gap:6px}
.name{font-weight:600;font-size:15px;min-height:40px}
.price{font-size:20px;font-weight:800}
.old{text-decoration:line-through;color:#8a93a6;font-size:14px;margin-left:6px}
.card form{padding:0 14px 14px;margin:0}
.btn-sm{width:100%;background:#0f5fd7;color:#fff;padding:9px;border-radius:6px;font-weight:600;border:0;cursor:pointer}
.box{background:#fff;border-radius:10px;padding:20px;margin:16px 0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.two{display:grid;grid-template-columns:1fr 1.2fr;gap:24px}
.big{height:320px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:120px}
input,textarea,select{padding:9px 11px;border:1px solid #cfd6e4;border-radius:6px;font-size:14px;width:100%;margin:6px 0}
label{font-size:13px;color:#5b6577}
.err{color:#c0392b;background:#fdecea;padding:10px;border-radius:6px}
.ok{color:#1e7b3a;background:#e8f7ee;padding:10px;border-radius:6px}
table{width:100%;border-collapse:collapse}
td,th{padding:8px;border-bottom:1px solid #eef1f6;text-align:left;font-size:14px}
.avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;background:#dfe6f2}
footer{background:#0f2747;color:#c6d2e8;margin-top:40px;padding:24px 0;font-size:13px}
@media(max-width:700px){.two{grid-template-columns:1fr}.top .wrap{flex-wrap:wrap}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="/">Nova<span>Market</span></a>
  <form class="search" action="/search" method="get">
    <input name="q" placeholder="Məhsul axtar..." value="{{ request.args.get('q','') }}">
    <button>Axtar</button>
  </form>
  <div class="acts">
    {% if session.get('user') %}
      <a href="/profile">{{ session.get('user') }}</a><a href="/logout">Çıxış</a>
    {% else %}
      <a href="/login">Daxil ol</a>
    {% endif %}
    <a href="/cart">Səbət ({{ cart_count }})</a>
  </div>
</div></header>
<nav class="cats"><div class="wrap">
  {% for c in nav_cats %}<a href="/category?cat={{ c.id }}">{{ c.name }}</a>{% endfor %}
</div></nav>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<footer><div class="wrap">© 2026 NovaMarket. Bütün hüquqlar qorunur.</div></footer>
</body>
</html>
