{% extends "base.html" %}
{% block title %}Daxil ol — NovaMarket{% endblock %}
{% block content %}
<div class="box" style="max-width:420px;margin:40px auto">
  <h2 style="margin-top:0">Hesabınıza daxil olun</h2>
  {% if err %}<p class="err">{{ err }}</p>{% endif %}
  <form method="post">
    <label>İstifadəçi adı</label>
    <input name="username" autocomplete="username">
    <label>Şifrə</label>
    <input type="password" name="password" autocomplete="current-password">
    <button class="btn" style="width:100%;margin-top:10px">Daxil ol</button>
  </form>
</div>
{% endblock %}
