<div class="grid">
{% for p in products %}
  <div class="card">
    <a href="/product?id={{ p.id }}">
      <div class="thumb" style="background:{{ p.image_color }}">{{ p.emoji }}</div>
      <div class="info">
        <div class="name">{{ p.name }}</div>
        <div>
          <span class="price">{{ "%.0f"|format(p.price) }} ₼</span>
          {% if p.old_price %}<span class="old">{{ "%.0f"|format(p.old_price) }} ₼</span>{% endif %}
        </div>
      </div>
    </a>
    <form method="post" action="/cart/add">
      <input type="hidden" name="id" value="{{ p.id }}">
      <button class="btn-sm">Səbətə at</button>
    </form>
  </div>
{% else %}
  <p>Bu kateqoriyada məhsul yoxdur.</p>
{% endfor %}
</div>
